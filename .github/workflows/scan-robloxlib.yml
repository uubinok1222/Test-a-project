name: luau-recon

on:
  workflow_dispatch:

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils file python3-pip
          pip3 install lief

      - name: Download RobloxLib
        run: |
          curl -L --fail --retry 3 -o RobloxLib "https://pixeldrain.com/api/file/w7YGoTyZ"
          ls -lh RobloxLib
          file RobloxLib
          sha256sum RobloxLib

      - name: Dump symbols
        run: |
          cat > /tmp/dump_syms.py << 'PYEOF'
          import lief
          fat = lief.MachO.parse("RobloxLib")
          with open("symbols_all.txt", "w") as f:
              for b in fat:
                  for sym in b.symbols:
                      f.write(sym.name + "\n")
          print("dumped")
          PYEOF
          python3 /tmp/dump_syms.py
          wc -l symbols_all.txt

      - name: Grep Luau / lua / ScriptContext
        run: |
          S="symbols_all.txt"
          echo "############ [1] lua_ C API ############"
          grep -E "^_lua_|^_luaL_|^_luaD_|^_luaV_|^_luaH_|^_luaS_|^_luaT_|^_luaG_|^_luaE_|^_luaF_|^_luaC_|^_luaM_|^_luaO_|^_luaU_|^_luaX_|^_luaY_|^_luaZ_" "$S" | head -200 || echo none

          echo ""
          echo "############ [2] lua_pcall / lua_resume / lua_load / loadstring / loadbuffer ############"
          grep -iE "lua_pcall|lua_resume|lua_load|lua_call|loadstring|loadbuffer|luaL_load" "$S" | head -100 || echo none

          echo ""
          echo "############ [3] Luau:: namespace (C++ mangled) ############"
          grep -E "_ZN4Luau" "$S" | head -200 || echo none

          echo ""
          echo "############ [4] Luau compile / codegen / bytecode ############"
          grep -iE "Luau.*(compile|codegen|bytecode|execute|parse|load)" "$S" | head -120 || echo none

          echo ""
          echo "############ [5] RBX::Lua namespace ############"
          grep -E "_ZN3RBX3Lua" "$S" | head -200 || echo none

          echo ""
          echo "############ [6] ScriptContext ############"
          grep -E "ScriptContext" "$S" | head -120 || echo none

          echo ""
          echo "############ [7] lua_State / lua_Debug trong symbol ############"
          grep -E "lua_State|lua_Debug" "$S" | head -60 || echo none

          echo ""
          echo "############ [8] LuauExpr / LuaBridge / WeakThreadRef ############"
          grep -iE "LuauExpression|LuaBridge|WeakThreadRef|ScriptContextFacets" "$S" | head -120 || echo none

          echo ""
          echo "############ [9] execute / resume / pcall (chung) ############"
          grep -iE "^__ZN.*(execute|resume|pcall|invoke)" "$S" | grep -iE "lua|script|vm" | head -120 || echo none

      - name: Grep strings quan trọng
        run: |
          strings -a RobloxLib > all_strings.txt
          echo "############ [A] lua error strings ############"
          grep -iE "attempt to (index|call|compare|concatenate|perform)" all_strings.txt | head -40 || echo none
          echo ""
          echo "############ [B] Luau compiler strings ############"
          grep -iE "luau|luac|bytecode|opcode|proto" all_strings.txt | sort -u | head -80 || echo none
          echo ""
          echo "############ [C] ScriptContext / Runtime strings ############"
          grep -iE "ScriptContext|LocalScript|ModuleScript|ScriptRuntime" all_strings.txt | sort -u | head -60 || echo none
          echo ""
          echo "############ [D] getgenv / executor strings ############"
          grep -iE "getgenv|getrenv|getrawmetatable|hookfunction|identifyexecutor|setreadonly|checkcaller|islclosure" all_strings.txt | sort -u | head -40 || echo none

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luau-recon
          path: |
            symbols_all.txt
            all_strings.txt
          retention-days: 7
