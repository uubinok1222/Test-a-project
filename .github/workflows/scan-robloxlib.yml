name: scan-robloxlib

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils file python3-pip
          pip3 install lief

      - name: Download RobloxLib
        run: |
          curl -L --fail --retry 3 -o RobloxLib "https://pixeldrain.com/api/file/w7YGoTyZ"
          ls -lh RobloxLib
          file RobloxLib
          sha256sum RobloxLib

      - name: Mach-O analysis
        run: |
          cat > /tmp/macho.py << 'PYEOF'
          import lief
          import sys
          path = "RobloxLib"
          fat = lief.MachO.parse(path)
          if fat is None:
              print("ERROR: cannot parse")
              sys.exit(1)
          print(f"slices: {len(fat)}")
          for i, b in enumerate(fat):
              print(f"\n--- slice {i} ---")
              print(f"cpu: {b.header.cpu_type}")
              print(f"n libraries: {len(b.libraries)}")
              print(f"segments:")
              for seg in b.segments:
                  print(f"  {seg.name} size={seg.virtual_size:#x}")
              print(f"symbols: {len(b.symbols)}")

              print("\nfirst 50 symbols:")
              count = 0
              for sym in b.symbols:
                  print(f"  {sym.name}")
                  count += 1
                  if count >= 50:
                      break

              print("\nsymbols containing 'lua':")
              count = 0
              for sym in b.symbols:
                  if "lua" in sym.name.lower():
                      print(f"  {sym.name}")
                      count += 1
                      if count >= 100:
                          break
              if count == 0:
                  print("  (none)")

              print("\nsymbols containing keywords:")
              keywords = ["pcall", "loadstring", "loadbuffer", "getglobal", "setglobal",
                          "getfield", "setfield", "pushcfunction", "newstate"]
              for kw in keywords:
                  matches = []
                  for sym in b.symbols:
                      if kw.lower() in sym.name.lower():
                          matches.append(sym.name)
                          if len(matches) >= 10:
                              break
                  if matches:
                      print(f"  [{kw}]")
                      for m in matches:
                          print(f"    {m}")
          PYEOF
          python3 /tmp/macho.py

      - name: Dump all symbols
        run: |
          cat > /tmp/dump_syms.py << 'PYEOF'
          import lief
          fat = lief.MachO.parse("RobloxLib")
          with open("symbols_all.txt", "w") as f:
              for b in fat:
                  for sym in b.symbols:
                      f.write(sym.name + "\n")
          print("dumped")
          PYEOF
          python3 /tmp/dump_syms.py
          wc -l symbols_all.txt || true
          echo "=== symbols with lua/luau ==="
          grep -iE "lua|luau" symbols_all.txt | head -100 || echo "none"
          echo ""
          echo "=== symbols with pcall/load/state ==="
          grep -iE "pcall|loadstring|loadbuffer|getglobal|setglobal|getfield|setfield|pushcfunction|newstate|lua_state" symbols_all.txt | head -100 || echo "none"
          echo ""
          echo "=== symbols with Luau namespace (C++ mangled) ==="
          grep -E "_ZN4Luau|Luau" symbols_all.txt | head -50 || echo "none"

      - name: Luau string scan
        run: |
          F="RobloxLib"
          echo "=== Luau error strings ==="
          for s in "attempt to index" "attempt to call" "stack overflow" \
                   "bad argument" "table expected" "string expected" \
                   "number expected" "attempt to perform arithmetic" \
                   "attempt to concatenate" "attempt to compare" \
                   "function expected" "userdata expected"; do
            count=$(strings -a "$F" | grep -c "$s" || true)
            echo "  \"$s\": $count"
          done

      - name: Lua symbols via strings
        run: |
          F="RobloxLib"
          echo "=== lua_ symbols via strings ==="
          strings -a "$F" | grep -E "^lua_|^luaL_|^luaD_|^luaV_" | sort -u | head -100 || echo "none"
          echo ""
          echo "=== luau/getgenv keywords ==="
          strings -a "$F" | grep -iE "luau|getgenv|lua_State|lua_pcall|luaL_load" | sort -u | head -60 || echo "none"

      - name: Save strings dump
        run: |
          strings -a RobloxLib > robloxlib_strings.txt
          wc -l robloxlib_strings.txt
          grep -iE "lua|luau" robloxlib_strings.txt > lua_strings.txt || true
          wc -l lua_strings.txt || true
          head -100 lua_strings.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: robloxlib-analysis
          path: |
            robloxlib_strings.txt
            lua_strings.txt
            symbols_all.txt
          retention-days: 7
